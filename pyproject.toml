[tool.black]
line-length = 88
include = '\\.pyi?$'

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sql_logic.*"]
disable_error_code = ["valid-type", "misc"]
