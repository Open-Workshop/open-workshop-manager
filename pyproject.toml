[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-workshop-manager"
version = "0.1.0"
description = "OpenWorkshop.Manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2.0",
    "python-multipart",
    "SQLAlchemy",
    "google-auth-oauthlib",
    "yandexid-new",
    "bcrypt",
    "aiohttp",
    "granian",
    "aiomysql",
    "greenlet",
    "PyJWT",
    "nats-py",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-aiohttp-client",
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
]

[project.scripts]
open-workshop-manager = "open_workshop_manager.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_workshop_manager*"]

[tool.black]
line-length = 88
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src"]
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sql_logic.*"]
disable_error_code = ["valid-type", "misc"]
